<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Mixarr</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --accent: #00d4aa;
      --text-primary: #ffffff;
      --text-secondary: #b8b8c8;
      --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container { max-width: 480px; }
    h1 { font-size: 5rem; color: var(--accent); margin-bottom: 0.5rem; }
    h2 { font-size: 1.5rem; margin-bottom: 1rem; font-weight: 500; }
    p { color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: var(--accent);
      color: var(--bg-primary);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist. It may have been moved or removed.</p>
    <a href="/mixarr/">Back to Mixarr</a>
  </div>
</body>
</html>
